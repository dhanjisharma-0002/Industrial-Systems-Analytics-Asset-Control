version: '3.8'

services:
  # ============================================================================
  # MySQL Database Service
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: isaac_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-isaac_root_secure_pass}
      MYSQL_DATABASE: ${DB_NAME:-isaac_db}
      MYSQL_USER: ${DB_USER:-isaac_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-isaac_secure_password_2026}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - isaac_network

  # ============================================================================
  # Zookeeper (Event Streaming Coordinator)
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: isaac_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - isaac_network

  # ============================================================================
  # Apache Kafka (Industrial Event Streaming Broker)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: isaac_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - isaac_network

  # ============================================================================
  # ISAAC Backend (FastAPI + ML Inference + WebSocket + Analytics)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: isaac_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_NAME=I.S.A.A.C.
      - APP_ENV=production
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - DB_USER=${DB_USER:-isaac_user}
      - DB_PASSWORD=${DB_PASSWORD:-isaac_secure_password_2026}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-isaac_db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_this_to_a_super_secret_production_key_32bytes_minimum}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=480
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://frontend
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_TELEMETRY=industrial_sensor_telemetry
      - KAFKA_CONSUMER_GROUP=isaac_prediction_group
      - KAFKA_FALLBACK_TO_LOCAL=True
      - PREDICTIONS_STORE_SENSOR_HISTORY=True
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - isaac_network

  # ============================================================================
  # ISAAC Frontend (Vite React Dashboard via Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: isaac_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - isaac_network

networks:
  isaac_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
